<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>พุงโตสเต็ก — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Sarabun', sans-serif; background: #f5f5f0; min-height: 100vh; }
.header { background: #1a1a1a; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; display: inline-block; }
.dot.offline { background: #e53935; }
.header h1 { font-size: 16px; font-weight: 700; }
.last-update { font-size: 11px; color: #aaa; }
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: #fff; border-bottom: 1px solid #eee; }
.stat { text-align: center; padding: 12px 8px; border-right: 1px solid #f0f0f0; }
.stat:last-child { border-right: none; }
.stat-num { font-size: 22px; font-weight: 700; color: #1a1a1a; }
.stat-num.amber { color: #e8b84b; }
.stat-num.red { color: #e53935; }
.stat-num.green { color: #43a047; }
.stat-label { font-size: 11px; color: #888; margin-top: 2px; }
.section-bar { background: #f5f5f0; padding: 10px 16px; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.cards { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.table-card { background: #fff; border-radius: 14px; border: 1.5px solid #eee; overflow: hidden; }
.table-card.urgent { border-color: #e8b84b; }
.table-card.new { border-color: #ef5350; }
.card-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
.table-num { font-size: 16px; font-weight: 700; }
.card-meta { display: flex; align-items: center; gap: 8px; }
.time { font-size: 11px; color: #aaa; }
.status-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.pill-new { background: #fce4ec; color: #c62828; }
.pill-cooking { background: #e8f5e9; color: #2e7d32; }
.pill-pay { background: #fff3e0; color: #e65100; }
.pill-paid { background: #e8f5e9; color: #2e7d32; }
.card-items { padding: 8px 14px; font-size: 14px; color: #555; line-height: 1.7; border-top: 1px solid #f5f5f0; border-bottom: 1px solid #f5f5f0; }
.card-footer { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
.total-label { font-size: 13px; color: #888; }
.total-amt { font-size: 17px; font-weight: 700; color: #e8b84b; }
.btn-row { padding: 10px 14px; display: flex; gap: 8px; border-top: 1px solid #f5f5f0; flex-wrap: wrap; }
.btn { border: none; border-radius: 8px; padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; flex: 1; font-family: 'Sarabun', sans-serif; min-width: 70px; }
.btn:active { opacity: 0.8; transform: scale(0.97); }
.btn-green { background: #e8f5e9; color: #2e7d32; }
.btn-amber { background: #fff3e0; color: #e65100; }
.btn-blue { background: #e3f2fd; color: #1565c0; }
.btn-purple { background: #f3e5f5; color: #6a1b9a; }
.btn-gray { background: #f5f5f0; color: #666; }
.btn-red { background: #fce4ec; color: #c62828; }
.empty { text-align: center; padding: 40px 20px; color: #aaa; font-size: 15px; }
.bottom-bar { text-align: center; padding: 16px; font-size: 12px; color: #aaa; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; display: none; z-index: 999; }
.toast.show { display: block; }
.pay-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
.pay-modal-bg.show { display: flex; }
.pay-modal { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-width: 480px; }
.pay-modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.pay-modal p { font-size: 13px; color: #888; margin-bottom: 20px; }
.pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.pay-option { border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Sarabun', sans-serif; }
.pay-cancel { background: #f5f5f0; color: #666; border: none; border-radius: 12px; padding: 12px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Sarabun', sans-serif; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="dot" id="status-dot"></div>
    <h1>พุงโตสเต็ก — Admin</h1>
  </div>
  <span class="last-update" id="last-update">กำลังโหลด...</span>
</div>

<div class="summary">
  <div class="stat"><div class="stat-num amber" id="s-active">0</div><div class="stat-label">โต๊ะใช้งาน</div></div>
  <div class="stat"><div class="stat-num" id="s-cooking">0</div><div class="stat-label">กำลังทำ</div></div>
  <div class="stat"><div class="stat-num red" id="s-pay">0</div><div class="stat-label">รอเก็บเงิน</div></div>
  <div class="stat"><div class="stat-num green" id="s-today">0</div><div class="stat-label">ยอดวันนี้ ฿</div></div>
</div>

<div class="section-bar">รายการโต๊ะ</div>
<div class="cards" id="cards-container">
  <div class="empty">กำลังโหลดข้อมูล...</div>
</div>

<div class="bottom-bar" id="bottom-bar">polling ทุก 3 วินาที</div>

<div class="toast" id="toast"></div>

<div class="pay-modal-bg" id="pay-modal-bg">
  <div class="pay-modal">
    <h2>เลือกวิธีชำระเงิน</h2>
    <p id="pay-modal-table">โต๊ะ —</p>
    <div class="pay-grid">
      <button class="pay-option btn-amber" onclick="confirmPay('cash')">💵 เงินสด</button>
      <button class="pay-option btn-blue" onclick="confirmPay('transfer')">📱 เงินโอน</button>
      <button class="pay-option btn-purple" onclick="confirmPay('credit')">💳 บัตรเครดิต</button>
      <button class="pay-option btn-green" onclick="confirmPay('alipay')">🀄 Alipay</button>
    </div>
    <button class="pay-cancel" onclick="closePayModal()">ยกเลิก</button>
  </div>
</div>

<script>
const N8N_URL = 'https://workflow.noicmidev.site/webhook';
const STATUS_URL = N8N_URL + '/pts-status';
const ACTION_URL = N8N_URL + '/pts-admin-action';

const STATUS_LABEL = {
  ordered: 'ออเดอร์ใหม่',
  confirmed: 'กำลังทำ',
  payment_requested: 'ขอชำระเงิน',
  paid: 'ชำระแล้ว',
  reset: 'ว่าง'
};

const STATUS_PILL = {
  ordered: 'pill-new',
  confirmed: 'pill-cooking',
  payment_requested: 'pill-pay',
  paid: 'pill-paid'
};

const CARD_CLASS = {
  ordered: 'new',
  payment_requested: 'urgent'
};

const PAY_LABEL = {
  cash: '💵 เงินสด',
  transfer: '📱 เงินโอน',
  credit: '💳 บัตรเครดิต',
  alipay: '🀄 Alipay'
};

let tables = [];
let selectedTable = null;
let todayTotal = 0;
let isOnline = false;

async function fetchAllStatus() {
  try {
    const res = await fetch(STATUS_URL + '?action=all');
    const data = await res.json();
    isOnline = true;
    document.getElementById('status-dot').className = 'dot';
    tables = Array.isArray(data) ? data : (data.tables || []);
    renderAll();
    updateLastUpdate();
  } catch(e) {
    isOnline = false;
    document.getElementById('status-dot').className = 'dot offline';
    document.getElementById('last-update').textContent = 'ออฟไลน์';
  }
}

function renderAll() {
  const active = tables.filter(t => t.status && t.status !== 'reset' && t.status !== 'paid');
  const cooking = tables.filter(t => t.status === 'confirmed');
  const payPending = tables.filter(t => t.status === 'payment_requested');

  document.getElementById('s-active').textContent = active.length;
  document.getElementById('s-cooking').textContent = cooking.length;
  document.getElementById('s-pay').textContent = payPending.length;
  document.getElementById('s-today').textContent = todayTotal.toLocaleString();

  const container = document.getElementById('cards-container');

  if (active.length === 0) {
    container.innerHTML = '<div class="empty">ไม่มีโต๊ะที่ใช้งานอยู่ขณะนี้ 🎉</div>';
    return;
  }

  // เรียง: ขอชำระเงินก่อน, ออเดอร์ใหม่, กำลังทำ
  const order = { payment_requested: 0, ordered: 1, confirmed: 2 };
  active.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));

  container.innerHTML = active.map(t => buildCard(t)).join('');
}

function buildCard(t) {
  const pill = STATUS_PILL[t.status] || 'pill-cooking';
  const label = STATUS_LABEL[t.status] || t.status;
  const cardClass = CARD_CLASS[t.status] || '';
  const total = Number(t.total || 0);

  let btns = '';
  if (t.status === 'ordered') {
    btns = `
      <div class="btn-row">
        <button class="btn btn-green" onclick="doAction('confirm', '${t.table}')">✅ รับทราบออเดอร์</button>
        <button class="btn btn-gray" onclick="doReset('${t.table}')">🔓 Reset</button>
      </div>`;
  } else if (t.status === 'confirmed') {
    btns = `
      <div class="btn-row">
        <button class="btn btn-amber" onclick="openPayModal('${t.table}')">💳 เก็บเงิน</button>
        <button class="btn btn-gray" onclick="doReset('${t.table}')">🔓 Reset</button>
      </div>`;
  } else if (t.status === 'payment_requested') {
    btns = `
      <div class="btn-row">
        <button class="btn btn-amber" onclick="openPayModal('${t.table}')">💳 เก็บเงิน</button>
        <button class="btn btn-gray" onclick="doReset('${t.table}')">🔓 Reset</button>
      </div>`;
  }

  return `
    <div class="table-card ${cardClass}">
      <div class="card-header">
        <span class="table-num">โต๊ะ ${t.table}</span>
        <div class="card-meta">
          <span class="time">${t.updated || ''}</span>
          <span class="status-pill ${pill}">${label}</span>
        </div>
      </div>
      <div class="card-items">${t.order_summary || 'ไม่มีข้อมูลรายการ'}</div>
      <div class="card-footer">
        <span class="total-label">ยอดรวม</span>
        <span class="total-amt">${total.toLocaleString()} ฿</span>
      </div>
      ${btns}
    </div>`;
}

async function doAction(action, table) {
  try {
    await fetch(ACTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, table })
    });
    showToast(action === 'confirm' ? `✅ รับทราบออเดอร์โต๊ะ ${table}` : `🔓 Reset โต๊ะ ${table} แล้ว`);
    setTimeout(fetchAllStatus, 500);
  } catch(e) {
    showToast('เกิดข้อผิดพลาด กรุณาลองใหม่');
  }
}

function doReset(table) {
  if (!confirm(`Reset โต๊ะ ${table}? ลูกค้าจะถูกรีเซ็ตหน้าจอ`)) return;
  doAction('reset', table);
}

function openPayModal(table) {
  selectedTable = table;
  document.getElementById('pay-modal-table').textContent = `โต๊ะ ${table} — เลือกวิธีชำระเงิน`;
  document.getElementById('pay-modal-bg').classList.add('show');
}

function closePayModal() {
  document.getElementById('pay-modal-bg').classList.remove('show');
  selectedTable = null;
}

async function confirmPay(type) {
  if (!selectedTable) return;
  closePayModal();
  try {
    await fetch(ACTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'paid', table: selectedTable, payment_type: PAY_LABEL[type] })
    });
    showToast(`💳 โต๊ะ ${selectedTable} ชำระด้วย ${PAY_LABEL[type]} แล้ว`);
    setTimeout(fetchAllStatus, 500);
  } catch(e) {
    showToast('เกิดข้อผิดพลาด กรุณาลองใหม่');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function updateLastUpdate() {
  const now = new Date().toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  document.getElementById('last-update').textContent = now;
}

fetchAllStatus();
setInterval(fetchAllStatus, 3000);
</script>
</body>
</html>
